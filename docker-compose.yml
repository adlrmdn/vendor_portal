version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vendor-portal
    container_name: vendor_portal_app
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # Ensure key is set, or better, mount .env


    volumes:
      - .:/var/www/html
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
      - ./.env:/var/www/html/.env
    restart: unless-stopped
