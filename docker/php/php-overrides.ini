; PoItems with many rolls (some exceed 200) submit one <input> per roll field
; (vendor_roll_no, bale_no, internal_id, color, weight, length_yd, length_m,
; id, delete) via VendorController/AdminController::saveItemRolls. At the
; PHP default of 1000, that form silently truncates around roll ~111, and the
; roll(s) past the cutoff never reach $_POST — surfacing as a false
; "must be a valid number greater than 0" validation error even though the
; field is filled in the browser.
max_input_vars = 10000

; The image/delivery-note upload endpoints (QcApprovalController::
; uploadMaterialReturnSigned, SubconAdminController::uploadMaterialReturn,
; SubconVendorController::uploadMaterialReturn) validate up to
; max:10240 (10MB) in Laravel — but no base php.ini is shipped in this
; image (only conf.d snippets + compiled-in defaults), so the real ceiling
; was PHP's compiled default upload_max_filesize=2M/post_max_size=8M.
; A phone-camera JPEG (routinely 3-8MB) silently exceeded that BEFORE
; Laravel's validation ever ran — PHP drops the file server-side
; (UPLOAD_ERR_INI_SIZE), so $_FILES['file'] never arrives and the form
; fails with a generic "file is required"-shaped error, not a real size
; message. PDFs "happened" to usually stay under 2MB (more compressed),
; which is why this looked like a JPG-only problem rather than an
; any-file-over-2MB problem. Match (with headroom) the app's own declared
; 10MB ceiling instead of leaving PHP's default far below it.
upload_max_filesize = 12M
post_max_size = 13M
