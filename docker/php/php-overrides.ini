; PoItems with many rolls (some exceed 200) submit one <input> per roll field
; (vendor_roll_no, bale_no, internal_id, color, weight, length_yd, length_m,
; id, delete) via VendorController/AdminController::saveItemRolls. At the
; PHP default of 1000, that form silently truncates around roll ~111, and the
; roll(s) past the cutoff never reach $_POST — surfacing as a false
; "must be a valid number greater than 0" validation error even though the
; field is filled in the browser.
max_input_vars = 10000
